name: Android CI/CD

on:
  push:
    branches: [develop, main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main, master]
  schedule:
    - cron: '0 2 * * *'  # nightly at 2am UTC
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# ── Reusable step fragments ─────────────────────────────────────────────────
# NOTE: GitHub Actions does not support true YAML anchors across jobs, so
# the JNI setup steps are duplicated. If this grows, extract to a composite
# action in .github/actions/build-jni/.

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true
      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: cSploit/build/reports/lint-results*.html
          retention-days: 7
          if-no-files-found: warn

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test --stacktrace
        continue-on-error: true

  # ── Debug build: every push to a branch (not tags, not PRs) ──────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true
      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cd cSploit/build/outputs/apk/debug
          for f in *.apk; do
            mv "$f" "cSploit-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.apk"
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}
          path: cSploit/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ── Release build: only on v* tags ───────────────────────────────────────
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true
      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          VERSION=$(grep "versionName" cSploit/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > $HOME/keystore.jks
      - name: Build release APK
        run: ./gradlew clean assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/keystore.jks', env.HOME) || '' }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PWD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      - name: Rename APK
        run: |
          cd cSploit/build/outputs/apk/release
          for f in *.apk; do
            mv "$f" "cSploit-${{ steps.version.outputs.tag_name }}.apk"
          done
      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-${{ steps.version.outputs.tag_name }}
          path: cSploit/build/outputs/apk/release/*.apk
          retention-days: 90
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: cSploit ${{ steps.version.outputs.tag_name }}
          files: cSploit/build/outputs/apk/release/*.apk
          draft: false
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag_name, '-beta') || contains(steps.version.outputs.tag_name, '-rc') || contains(steps.version.outputs.tag_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── PR build ──────────────────────────────────────────────────────────────
  pr-build:
    name: PR Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true
      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Get PR info
        id: pr
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cd cSploit/build/outputs/apk/debug
          for f in *.apk; do
            mv "$f" "cSploit-PR${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.sha_short }}.apk"
          done
      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-PR${{ steps.pr.outputs.pr_number }}
          path: cSploit/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **APK Built!** Download from [Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })

  # ── Nightly build ─────────────────────────────────────────────────────────
  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: true
      - name: Build JNI libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd cSploit
          chmod +x build-jni-libs.sh
          ./build-jni-libs.sh
          ls -la src/main/jniLibs/*/lib*.so || (echo "ERROR: JNI libraries not built!" && exit 1)
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Get version info
        id: version
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: Build nightly APK
        run: ./gradlew clean assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cd cSploit/build/outputs/apk/debug
          for f in *.apk; do
            mv "$f" "cSploit-nightly-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha_short }}.apk"
          done
      - name: Upload nightly APK
        uses: actions/upload-artifact@v4
        with:
          name: cSploit-nightly-${{ steps.version.outputs.date }}
          path: cSploit/build/outputs/apk/debug/*.apk
          retention-days: 7
